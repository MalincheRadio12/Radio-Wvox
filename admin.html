<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Radio Wvox Fm 📻</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', Arial, sans-serif;
            background: #0a0a1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: #1a1a2e;
            border-radius: 25px;
            padding: 30px;
            max-width: 700px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255,255,255,0.05);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 i {
            color: #0084ff;
        }

        .header .badge {
            background: #0084ff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stats .stat-item {
            background: rgba(255,255,255,0.03);
            padding: 10px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            flex: 1;
            min-width: 100px;
            text-align: center;
        }

        .stats .stat-item .number {
            font-size: 28px;
            font-weight: 700;
            color: #0084ff;
        }

        .stats .stat-item .label {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            margin-top: 2px;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .actions button {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            font-family: 'Rajdhani', Arial, sans-serif;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            justify-content: center;
        }

        .btn-danger {
            background: #ff4757;
            color: #fff;
        }

        .btn-danger:hover {
            background: #ff6b81;
            transform: scale(1.02);
        }

        .btn-primary {
            background: #0084ff;
            color: #fff;
        }

        .btn-primary:hover {
            background: #3395ff;
            transform: scale(1.02);
        }

        .btn-success {
            background: #2ecc71;
            color: #fff;
        }

        .btn-success:hover {
            background: #55d98a;
            transform: scale(1.02);
        }

        .btn-warning {
            background: #ffd93d;
            color: #1a1a1a;
        }

        .btn-warning:hover {
            background: #ffe566;
            transform: scale(1.02);
        }

        .messages-container {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .messages-container::-webkit-scrollbar {
            width: 4px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.02);
            border-radius: 10px;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: #0084ff;
            border-radius: 10px;
        }

        .msg-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid rgba(255,255,255,0.04);
            transition: all 0.3s ease;
        }

        .msg-item:hover {
            background: rgba(255,255,255,0.06);
            border-color: rgba(0, 132, 255, 0.2);
        }

        .msg-item .msg-info {
            flex: 1;
            min-width: 0;
        }

        .msg-item .msg-info .msg-user {
            font-weight: 600;
            font-size: 14px;
            color: #0084ff;
        }

        .msg-item .msg-info .msg-text {
            font-size: 14px;
            color: rgba(255,255,255,0.8);
            word-break: break-word;
            margin-top: 2px;
        }

        .msg-item .msg-info .msg-time {
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            margin-top: 2px;
        }

        .msg-item .msg-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
            margin-left: 10px;
        }

        .msg-item .msg-actions button {
            background: none;
            border: none;
            color: rgba(255,255,255,0.3);
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .msg-item .msg-actions .delete-btn:hover {
            background: rgba(255, 71, 87, 0.2);
            color: #ff4757;
        }

        .msg-item .msg-actions .delete-btn:active {
            transform: scale(0.9);
        }

        .empty-message {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255,255,255,0.3);
        }

        .empty-message i {
            font-size: 48px;
            margin-bottom: 15px;
            display: block;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: rgba(255,255,255,0.3);
        }

        .loading i {
            font-size: 32px;
            margin-bottom: 10px;
            display: block;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #2ecc71;
            color: #fff;
            padding: 15px 25px;
            border-radius: 12px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.5s ease;
            z-index: 9999;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.error {
            background: #ff4757;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 18px;
            }

            .stats {
                gap: 10px;
            }

            .stats .stat-item .number {
                font-size: 22px;
            }

            .actions button {
                font-size: 12px;
                padding: 8px 14px;
            }

            .msg-item {
                flex-wrap: wrap;
                gap: 8px;
            }

            .msg-item .msg-actions {
                margin-left: 0;
                width: 100%;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>
                <i class="fas fa-user-shield"></i>
                Admin Chat
            </h1>
            <span class="badge">🔐 Privado</span>
        </div>

        <!-- ESTADÍSTICAS -->
        <div class="stats">
            <div class="stat-item">
                <div class="number" id="totalMessages">0</div>
                <div class="label">📨 Total Mensajes</div>
            </div>
            <div class="stat-item">
                <div class="number" id="uniqueUsers">0</div>
                <div class="label">👤 Usuarios</div>
            </div>
            <div class="stat-item">
                <div class="number" id="lastUpdate">-</div>
                <div class="label">🔄 Última actualización</div>
            </div>
        </div>

        <!-- ACCIONES -->
        <div class="actions">
            <button class="btn-danger" onclick="deleteAllMessages()">
                <i class="fas fa-trash-alt"></i> Eliminar Todos
            </button>
            <button class="btn-primary" onclick="refreshMessages()">
                <i class="fas fa-sync"></i> Actualizar
            </button>
            <button class="btn-success" onclick="exportMessages()">
                <i class="fas fa-download"></i> Exportar
            </button>
        </div>

        <!-- LISTA DE MENSAJES -->
        <div class="messages-container" id="messagesContainer">
            <div class="loading">
                <i class="fas fa-spinner"></i>
                Cargando mensajes...
            </div>
        </div>

        <!-- FOOTER -->
        <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
            <span style="color: rgba(255,255,255,0.3); font-size: 12px;">
                <i class="fas fa-shield-alt"></i> Solo administradores
            </span>
            <button onclick="window.location.href='index.html'" style="background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); padding: 8px 20px; border-radius: 12px; cursor: pointer; font-family: 'Rajdhani', Arial, sans-serif; font-weight: 600; transition: all 0.3s;">
                <i class="fas fa-arrow-left"></i> Volver a la Radio
            </button>
        </div>
    </div>

    <!-- TOAST DE NOTIFICACIÓN -->
    <div class="toast" id="toast"></div>

    <!-- ============================================ -->
    <!-- SCRIPTS                                     -->
    <!-- ============================================ -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>

    <script>
        // ========================================== //
        // CONFIGURACIÓN DE FIREBASE                  //
        // ========================================== //
        const firebaseConfig = {
            apiKey: "AIzaSyCwBKq4hOSc4TmY87xMUJCGhfMV8afA4Qs",
            authDomain: "radio-wvox-fm-28f00.firebaseapp.com",
            projectId: "radio-wvox-fm-28f00",
            storageBucket: "radio-wvox-fm-28f00.firebasestorage.app",
            messagingSenderId: "554075648438",
            appId: "1:554075648438:web:425fefbfe31707bd3e1117",
            measurementId: "G-N8T7F4BD5C"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const chatRef = firebase.firestore().collection('chat');
        let allMessages = [];
        let messageIds = [];

        // ========================================== //
        // FUNCIONES DEL PANEL                       //
        // ========================================== //

        // Cargar mensajes
        function loadMessages() {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i>Cargando mensajes...</div>';

            chatRef.orderBy('timestamp', 'desc').get().then((snapshot) => {
                allMessages = [];
                messageIds = [];
                const users = new Set();

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const id = doc.id;
                    allMessages.push({ id, ...data });
                    messageIds.push(id);
                    if (data.user) users.add(data.user);
                });

                // Actualizar estadísticas
                document.getElementById('totalMessages').textContent = allMessages.length;
                document.getElementById('uniqueUsers').textContent = users.size;
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();

                renderMessages();

            }).catch((error) => {
                console.error('Error cargando mensajes:', error);
                container.innerHTML = `
                    <div class="empty-message">
                        <i class="fas fa-exclamation-triangle" style="color: #ff4757;"></i>
                        Error al cargar mensajes<br>
                        <span style="font-size: 12px;">${error.message}</span>
                    </div>
                `;
            });
        }

        // Renderizar mensajes en el panel
        function renderMessages() {
            const container = document.getElementById('messagesContainer');
            
            if (allMessages.length === 0) {
                container.innerHTML = `
                    <div class="empty-message">
                        <i class="fas fa-comment-slash"></i>
                        No hay mensajes en el chat
                        <span style="display: block; font-size: 13px; margin-top: 5px;">Los mensajes aparecerán aquí cuando los usuarios escriban</span>
                    </div>
                `;
                return;
            }

            let html = '';
            allMessages.forEach((msg, index) => {
                const time = msg.timestamp ? 
                    new Date(msg.timestamp.seconds * 1000).toLocaleString() : 
                    'Fecha desconocida';
                
                const user = msg.user || 'Anónimo';
                const text = msg.message || '(mensaje vacío)';
                
                html += `
                    <div class="msg-item" data-id="${msg.id}">
                        <div class="msg-info">
                            <div class="msg-user">${user}</div>
                            <div class="msg-text">${text.replace(/\n/g, '<br>')}</div>
                            <div class="msg-time">${time}</div>
                        </div>
                        <div class="msg-actions">
                            <button class="delete-btn" onclick="deleteMessage('${msg.id}')" title="Eliminar mensaje">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Eliminar un mensaje específico
        function deleteMessage(messageId) {
            if (!confirm('¿Estás seguro de que quieres eliminar este mensaje?')) return;

            chatRef.doc(messageId).delete().then(() => {
                showToast('✅ Mensaje eliminado correctamente');
                // Remover de la lista local
                const index = allMessages.findIndex(m => m.id === messageId);
                if (index !== -1) {
                    allMessages.splice(index, 1);
                    renderMessages();
                    document.getElementById('totalMessages').textContent = allMessages.length;
                }
            }).catch((error) => {
                showToast('❌ Error al eliminar: ' + error.message, 'error');
            });
        }

        // Eliminar todos los mensajes
        function deleteAllMessages() {
            if (allMessages.length === 0) {
                showToast('ℹ️ No hay mensajes para eliminar');
                return;
            }

            if (!confirm(`¿Estás seguro de que quieres eliminar TODOS los ${allMessages.length} mensajes?`)) return;
            if (!confirm('⚠️ Esta acción NO se puede deshacer. ¿Confirmar?')) return;

            const batch = firebase.firestore().batch();
            allMessages.forEach((msg) => {
                const docRef = chatRef.doc(msg.id);
                batch.delete(docRef);
            });

            batch.commit().then(() => {
                showToast(`✅ ${allMessages.length} mensajes eliminados correctamente`);
                allMessages = [];
                renderMessages();
                document.getElementById('totalMessages').textContent = '0';
                document.getElementById('uniqueUsers').textContent = '0';
            }).catch((error) => {
                showToast('❌ Error al eliminar: ' + error.message, 'error');
            });
        }

        // Actualizar mensajes (recargar)
        function refreshMessages() {
            showToast('🔄 Actualizando...');
            loadMessages();
        }

        // Exportar mensajes (descargar JSON)
        function exportMessages() {
            if (allMessages.length === 0) {
                showToast('ℹ️ No hay mensajes para exportar');
                return;
            }

            const data = allMessages.map(msg => ({
                user: msg.user || 'Anónimo',
                message: msg.message || '',
                timestamp: msg.timestamp ? new Date(msg.timestamp.seconds * 1000).toISOString() : null
            }));

            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `chat_messages_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast(`✅ ${data.length} mensajes exportados`);
        }

        // ========================================== //
        // TOAST DE NOTIFICACIÓN                     //
        // ========================================== //
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show' + (type === 'error' ? ' error' : '');
            
            clearTimeout(toast.timeout);
            toast.timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ========================================== //
        // ESCUCHAR CAMBIOS EN TIEMPO REAL           //
        // ========================================== //
        chatRef.orderBy('timestamp', 'desc').onSnapshot((snapshot) => {
            // Solo actualizar si hay cambios
            let hasChanges = false;
            snapshot.docChanges().forEach((change) => {
                if (change.type === 'added' || change.type === 'modified' || change.type === 'removed') {
                    hasChanges = true;
                }
            });
            
            if (hasChanges) {
                loadMessages();
            }
        });

        // ========================================== //
        // INICIALIZAR                                //
        // ========================================== //
        document.addEventListener('DOMContentLoaded', function() {
            loadMessages();
            console.log('👑 Panel de administrador iniciado');
            console.log('📊 Gestionando mensajes del chat en tiempo real');
        });

        // ========================================== //
        // ACCESO RÁPIDO CON TECLADO                 //
        // ========================================== //
        document.addEventListener('keydown', (e) => {
            // Ctrl + R = Actualizar
            if (e.ctrlKey && e.key === 'r') {
                e.preventDefault();
                refreshMessages();
            }
            // Escape = Salir (solo si no hay confirmación abierta)
            if (e.key === 'Escape') {
                // No hacer nada, solo para referencia
            }
        });

        console.log('💡 Consejos:');
        console.log('  • Ctrl+R para actualizar');
        console.log('  • Los mensajes se actualizan en tiempo real');
        console.log('  • Puedes exportar los mensajes en JSON');
    </script>

</body>
</html>
